[package]
name = "fineco-ipc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Shared internal command protocol between the gateway and the store-query
# worker. Schema-first JSON with a strict command allowlist (no transport here;
# the gateway client + worker server own the Unix-socket I/O).
fineco-core = { path = "../fineco-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema derive for the wire DTOs, so the rmcp gateway can expose them as
# typed MCP tool inputs/outputs. Already in the workspace tree (via rmcp).
schemars = "1"

[lib]
name = "fineco_ipc"
path = "src/lib.rs"
