[package]
name = "fineco-refresh"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "fineco_refresh"
path = "src/lib.rs"

[dependencies]
