[package]
name = "fineco-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
fineco-core = { path = "../fineco-core" }
fineco-ipc = { path = "../fineco-ipc" }
fineco-store = { path = "../fineco-store" }
fineco-refresh = { path = "../fineco-refresh" }
fineco-tls = { path = "../fineco-tls" }
# Credentialed HTTP/TLS client (owner-approved: ureq + rustls). serde/serde_json
# ride along via ureq's `json` feature and are used to parse Fineco JSON.
# `rustls-no-provider` (not `rustls`, which force-pins ring): the crypto backend
# is aws-lc-rs, injected via `fineco_tls::tls_config()`. See `fineco-tls`.
ureq = { version = "3.3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Owner-approved credentialed-path dep: zero the Fineco password + session-cookie
# heap on drop so secrets don't linger in freed pages (core dump / swap). Already
# in the tree transitively (via rustls) — no new crate. `alloc` for `Zeroizing<String>`.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Tests drive the worker against the SYNTHETIC mock Fineco over a real socket.
httptiny = { path = "../../e2e/httptiny" }
mock-fineco = { path = "../../e2e/mock-fineco" }

[lib]
name = "fineco_worker"
path = "src/lib.rs"
