# Deployment drop-in for the owner MCP gateway. The shipped unit binds the
# documented default (127.0.0.1:8765); this overrides the bind to match the
# Cloudflare Tunnel ingress (the published-route service URL + HTTP Host Header),
# and pulls the per-host config/secrets from EnvironmentFiles so the unit itself
# stays free of deployment values:
#   /etc/fineco/access.env     — Cloudflare Access (issuer/audience/JWKS); REQUIRED
#                                (the gateway fails closed without it). The JWKS
#                                URL must be on the issuer's own origin. For a
#                                service-token deployment, also set
#                                FINECO_ACCESS_OWNER_COMMON_NAME to pin the token's
#                                Client ID (leave FINECO_OWNER_EMAIL unset).
#   /etc/fineco/enrichment.env — optional market/enrichment config: the
#                                enrichment host base + its SHA-256 host hash(es)
#                                (both together enable the market tools; absent →
#                                disabled). FINECO_ETF_URL is optional — the
#                                zero-commission ETF list defaults to the fixed
#                                public Fineco endpoint, so only set it to override.
#                                The enrichment host is config-only.
# Both are 0640 root:fineco-gateway and never committed.
[Service]
Environment=FINECO_GATEWAY_BIND=127.0.0.1:8799
EnvironmentFile=/etc/fineco/access.env
EnvironmentFile=-/etc/fineco/enrichment.env
