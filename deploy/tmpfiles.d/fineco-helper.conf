# systemd-tmpfiles — the per-socket runtime directories for the M8 topology.
#
# Each dir is setgid (2750) to its own IPC group, so a Unix socket created inside
# inherits that group (the binary then chmods it to 0660). The dir is owner-write
# only (NO group write): only the SERVING process (the owner) creates/unlinks the
# socket; group members merely traverse + connect (the 0660 socket inode). Group
# write would let any IPC-group member unlink the real socket and bind a fake one
# (local spoof/DoS), so it is deliberately withheld. Separate dirs/groups keep
# snapshot-query (cached reads) and refresh-control (live refresh) reachability
# independent, and keep the internet-facing gateway out of the live socket entirely:
#
#   /run/fineco-helper          snapshot-query.sock  group fineco-ipc-store    (gateway client)
#   /run/fineco-helper-refresh  refresh-control.sock group fineco-ipc-refresh  (gateway client, post-gate)
#   /run/fineco-worker          fineco-live.sock     group fineco-ipc-live     (store-server/controller client)
#
# Owner = the process that SERVES the socket (so it can create it); group = the
# IPC group whose members may CONNECT. The users/groups must exist before this
# runs (created at provision — see docs/DEPLOYMENT.md). On /run (tmpfs) these are
# recreated each boot by systemd-tmpfiles-setup, before the services start.
#
# Type Path                       Mode UID           GID                 Age Argument
d     /run/fineco-helper         2750 fineco-store  fineco-ipc-store    -   -
d     /run/fineco-helper-refresh 2750 fineco-store  fineco-ipc-refresh  -   -
d     /run/fineco-worker         2750 fineco-worker fineco-ipc-live     -   -
